name: CI

# This repo has no shared build system on purpose (see CLAUDE.md): each task
# directory owns its own toolchain. So CI is per-task jobs plus one repo-wide
# status gate. Add a job when a task starts shipping code; do not try to unify
# them behind a single command.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  e03:
    name: e03 - journey CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e03-claude-code-101

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  status:
    name: Program status has not drifted
    runs-on: ubuntu-latest
    needs: e03

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the journey CLI
        run: pip install -e ./e03-claude-code-101

      # Fails when the root README's status glyphs disagree with the
      # definition-of-done checkboxes in the task READMEs. Run from the repo
      # root so the CLI's upward search resolves here.
      - name: Check for status drift
        run: journey status --strict
